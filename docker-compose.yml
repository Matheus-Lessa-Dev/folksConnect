services:
  database:
    image: postgres:16-alpine
    container_name: folks-connect-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-folks_connect}
      POSTGRES_USER: ${POSTGRES_USER:-folks_connect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-folks_connect_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: folks-connect-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-folks_connect}
      DATABASE_USER: ${POSTGRES_USER:-folks_connect}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-folks_connect_dev}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: folks-connect-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data: